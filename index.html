<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentoRide</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>🏍️ RentoRide</h1>

  <h2>Login / Sign Up</h2>

  <input type="email" id="email" placeholder="Email">
  <br><br>

  <input type="password" id="password" placeholder="Password">
  <br><br>

  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>

  <p id="message"></p>
  <hr>
<button id="addBikeBtn">+ Add Your Bike</button>
<h2>Available Bikes</h2>

<div id="bikeList">
  Loading bikes...
</div>

  <div id="profile" style="display:none;">
    <h2>My Profile</h2>

    <p>
      Name:
      <span id="profileName"></span>
    </p>

    <p>
      Email:
      <span id="profileEmail"></span>
    </p>

    <p>
      Phone:
      <span id="profilePhone"></span>
    </p>
  </div>

  <script>
    const SUPABASE_URL = "https://axvttcxrhsblvkmcnqgb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Nn7T1_HByXSy9Vrxy4XgoA_KlsJAafa";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");

    const profile = document.getElementById("profile");
    const profileName = document.getElementById("profileName");
    const profileEmail = document.getElementById("profileEmail");
    const profilePhone = document.getElementById("profilePhone");


    // =========================
    // SIGN UP
    // =========================

    document.getElementById("signupBtn").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.innerText = "Please enter email and password.";
        return;
      }

      message.innerText = "Creating account...";

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      console.log("Signup response:", data, error);

      if (error) {
        message.innerText = error.message;
      } else {
        message.innerText = "Signup successful! Check your email.";
      }
    });


    // =========================
    // LOGIN
    // =========================

    document.getElementById("loginBtn").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.innerText = "Please enter email and password.";
        return;
      }

      message.innerText = "Logging in...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      console.log("Login response:", data, error);

      if (error) {
        message.innerText = error.message;
        return;
      }

      message.innerText = "Login successful!";

      // Get logged-in user's ID
      const user = data.user;

      if (!user) {
        message.innerText = "User not found.";
        return;
      }

      // Get profile from database
      const { data: profileData, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("id, name, email, phone")
          .eq("id", user.id)
          .single();

      console.log("Profile response:", profileData, profileError);

      if (profileError) {
        message.innerText =
          "Login successful, but profile could not be loaded: " +
          profileError.message;
        return;
      }

      // Show profile
      profile.style.display = "block";

      profileName.innerText = profileData.name || "Not added";
      profileEmail.innerText = profileData.email || user.email || "Not added";
      profilePhone.innerText = profileData.phone || "Not added";
    });

  </script>

</body>
</html>
