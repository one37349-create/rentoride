<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentoRide</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>🏍️ RentoRide</h1>

  <h2>Login / Sign Up</h2>

  <input type="email" id="email" placeholder="Email">
  <br><br>

  <input type="password" id="password" placeholder="Password">
  <br><br>

  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>

  <p id="message"></p>

  <script>
    const SUPABASE_URL = "https://axvttcxrhsblvkmcnqgb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Nn7T1_HByXSy9Vrxy4XgoA_KlsJAafa";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");

    document.getElementById("signupBtn").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.innerText = "Please enter email and password.";
        return;
      }
      console.log("Signup button clicked");
      
      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });
      
      console.log("Signup response:", error);

      if (error) {
        message.innerText = error.message;
      } else {
        message.innerText = "Signup successful! Check your email.";
      }
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.innerText = "Please enter email and password.";
        return;
      }

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        message.innerText = error.message;
      } else {
        message.innerText = "Login successful!";
      }
    });
  </script>

</body>
</html>
