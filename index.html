<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentoRide</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>🏍️ RentoRide</h1>

  <h2>Login / Sign Up</h2>

  <input type="email" id="email" placeholder="Email">
  <br><br>

  <input type="password" id="password" placeholder="Password">
  <br><br>

  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>

  <p id="message"></p>

  <hr>

  <button id="addBikeBtn">+ Add Your Bike</button>

  <div id="bikeForm" style="display:none;">

    <h3>Add Your Bike</h3>

    <input type="text" id="bikeName" placeholder="Bike Name">
    <br><br>

    <input type="text" id="bikeBrand" placeholder="Brand">
    <br><br>

    <input type="number" id="bikePrice" placeholder="Price per day">
    <br><br>
    <input type="number" id="price3h" placeholder="Price for 3 hours">
<br><br>

<input type="number" id="price6h" placeholder="Price for 6 hours">
<br><br>

<input type="number" id="price12h" placeholder="Price for 12 hours">
<br><br>

<input type="number" id="price24h" placeholder="Price for 24 hours">
<br><br>

    <input type="text" id="bikeLocation" placeholder="Location">
    <br><br>

    <input type="text" id="bikeImage" placeholder="Bike Image URL">
    <br><br>

    <button id="saveBikeBtn">Save Bike</button>

  </div>
<h2>My Bookings</h2>

<div id="myBookings">
  Loading bookings...
</div>
  <h2>Available Bikes</h2>

  <div id="bikeList">
    Loading bikes...
  </div>

  <div id="profile" style="display:none;">

    <h2>My Profile</h2>

    <p>
      Name:
      <span id="profileName"></span>
    </p>

    <p>
      Email:
      <span id="profileEmail"></span>
    </p>

    <p>
      Phone:
      <span id="profilePhone"></span>
    </p>

  </div>


  <script>

    const SUPABASE_URL = "https://axvttcxrhsblvkmcnqgb.supabase.co";

    const SUPABASE_KEY = "sb_publishable_Nn7T1_HByXSy9Vrxy4XgoA_KlsJAafa";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const message = document.getElementById("message");

    const profile = document.getElementById("profile");

    const profileName = document.getElementById("profileName");

    const profileEmail = document.getElementById("profileEmail");

    const profilePhone = document.getElementById("profilePhone");


    // =========================
    // SIGN UP
    // =========================

    document.getElementById("signupBtn").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;


      if (!email || !password) {

        message.innerText = "Please enter email and password.";

        return;

      }


      message.innerText = "Creating account...";


      const { data, error } = await supabaseClient.auth.signUp({

        email: email,

        password: password

      });


      console.log("Signup response:", data, error);


      if (error) {

        message.innerText = error.message;

      } else {

        message.innerText = "Signup successful!";

      }

    });


    // =========================
    // LOGIN
    // =========================

    document.getElementById("loginBtn").addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;


      if (!email || !password) {

        message.innerText = "Please enter email and password.";

        return;

      }


      message.innerText = "Logging in...";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      console.log("Login response:", data, error);


      if (error) {

        message.innerText = error.message;

        return;

      }


      message.innerText = "Login successful!";


      const user = data.user;
      console.log("Logged in user:", user);
      await loadMyBookings();
      if (!user) {

        message.innerText = "User not found.";

        return;

      }


      const { data: profileData, error: profileError } =
        await supabaseClient

          .from("profiles")

          .select("id, name, email, phone")

          .eq("id", user.id)

          .single();


      console.log("Profile response:", profileData, profileError);


      if (profileError) {

        message.innerText =
          "Login successful, but profile could not be loaded: " +
          profileError.message;

        return;

      }


      profile.style.display = "block";


      profileName.innerText =
        profileData.name || "Not added";


      profileEmail.innerText =
        profileData.email || user.email || "Not added";


      profilePhone.innerText =
        profileData.phone || "Not added";

    });


    // =========================
    // OPEN BIKE FORM
    // =========================

    document.getElementById("addBikeBtn").addEventListener("click", () => {

      document.getElementById("bikeForm").style.display = "block";

    });


    // =========================
    // SAVE BIKE
    // =========================

    document.getElementById("saveBikeBtn").addEventListener("click", async () => {

      const bikeName =
        document.getElementById("bikeName").value.trim();


      const bikeBrand =
        document.getElementById("bikeBrand").value.trim();


      const bikePrice =
        document.getElementById("bikePrice").value;


      const bikeLocation =
        document.getElementById("bikeLocation").value.trim();


      const bikeImage =
        document.getElementById("bikeImage").value.trim();


      if (!bikeName || !bikeBrand || !bikePrice || !bikeLocation) {

        message.innerText =
          "Please fill all required fields.";

        return;

      }


      const { data: userData } =
        await supabaseClient.auth.getUser();


      if (!userData.user) {

        message.innerText =
          "Please login first.";

        return;

      }


      message.innerText =
        "Adding bike...";


      const { error } =
        await supabaseClient

          .from("bikes")

          .insert({

            owner_id: userData.user.id,

            bike_name: bikeName,

            brand: bikeBrand,

            price_per_day: Number(bikePrice),

            location: bikeLocation,

            image_url: bikeImage

          });


      if (error) {

        message.innerText =
          error.message;

        return;

      }


      message.innerText =
        "Bike added successfully!";


      document.getElementById("bikeForm").style.display =
        "none";


      document.getElementById("bikeName").value = "";

      document.getElementById("bikeBrand").value = "";

      document.getElementById("bikePrice").value = "";

      document.getElementById("bikeLocation").value = "";

      document.getElementById("bikeImage").value = "";

    });
async function loadBikes() {

  const bikeList = document.getElementById("bikeList");

  bikeList.innerHTML = "Loading bikes...";

  const { data: bikes, error } = await supabaseClient
    .from("bikes")
    .select("id, bike_name, brand, price_per_day, location, image_url")

  if (error) {
    bikeList.innerText = error.message;
    return;
  }

  if (!bikes || bikes.length === 0) {
    bikeList.innerText = "No bikes available.";
    return;
  }

  bikeList.innerHTML = "";

  bikes.forEach((bike) => {

    const card = document.createElement("div");

    card.innerHTML = `
      <hr>
      <h3>${bike.bike_name}</h3>
      <p>Brand: ${bike.brand}</p>
      <p>₹${bike.price_per_day} / day</p>
      <p>📍 ${bike.location}</p>
      <button onclick="bookBike('${bike.id}', ${bike.price_per_day})">
  Book Now
</button>
    `;

    bikeList.appendChild(card);

  });
}
async function bookBike(bikeId, pricePerDay) {

  const { data: userData } = await supabaseClient.auth.getUser();

  if (!userData.user) {
    message.innerText = "Please login first.";
    return;
  }

  const startDate = prompt("Enter start date (YYYY-MM-DD):");

if (!startDate) return;
const pickupTime = await new Promise((resolve) => {
  const input = document.createElement("input");

  input.type = "time";
  input.style.position = "fixed";
  input.style.left = "50%";
  input.style.top = "50%";
  input.style.transform = "translate(-50%, -50%)";
  input.style.zIndex = "9999";

  document.body.appendChild(input);

  input.focus();

  input.addEventListener("change", () => {
    const value = input.value;
    input.remove();
    resolve(value);
  });
});
const endDate = prompt("Enter end date (YYYY-MM-DD):");

if (!endDate) return;
const dropoffTime = await new Promise((resolve) => {
  const overlay = document.createElement("div");

  overlay.style.position = "fixed";
  overlay.style.left = "0";
  overlay.style.top = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background = "white";
  overlay.style.zIndex = "9999";
  overlay.style.padding = "30px";
  overlay.style.boxSizing = "border-box";
  overlay.innerHTML = `
    <h3>Select Drop-off Time</h3>
    <input type="time" id="dropoffClock">
    <br><br>
    <button id="confirmDropoffTime">Continue</button>
  `;

  document.body.appendChild(overlay);

  document.getElementById("confirmDropoffTime").onclick = () => {
    const value = document.getElementById("dropoffClock").value;

    if (!value) {
      alert("Please select drop-off time.");
      return;
    }

    overlay.remove();
    resolve(value);
  };
});
  const start = new Date(startDate);
  const end = new Date(endDate);

  if (isNaN(start) || isNaN(end) || end < start) {
    message.innerText = "Please enter valid dates.";
    return;
  }

  const days =
    Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;

  const amount = days * Number(pricePerDay);

  const { error } = await supabaseClient
    .from("bookings")
    .insert({
  bike_id: bikeId,
  user_id: userData.user.id,
  start_date: startDate,
  end_date: endDate,
  pickup_time: pickupTime,
  dropoff_time: dropoffTime,
  amount: amount,
  status: "pending"
});

  if (error) {
    message.innerText = error.message;
    return;
  }

  message.innerText =
    "Booking request submitted! Total: ₹" + amount;
}
   async function loadMyBookings() {

  const bookingList = document.getElementById("myBookings");

  const { data: userData } = await supabaseClient.auth.getUser();

  if (!userData.user) {
    bookingList.innerText = "Please login to view your bookings.";
    return;
  }

  const { data: bookings, error } = await supabaseClient
    .from("bookings")
   .select("id, bike_id, start_date, end_date, pickup_time, dropoff_time, amount, status")
    .eq("user_id", userData.user.id)
    .order("start_date", { ascending: false });

  if (error) {
    bookingList.innerText = error.message;
    return;
  }

  if (!bookings || bookings.length === 0) {
    bookingList.innerText = "No bookings yet.";
    return;
  }

  bookingList.innerHTML = "";

  bookings.forEach((booking) => {

     const pickupTime = new Date(1970-01-01T${booking.pickup_time});
  const dropoffTime = new Date(1970-01-01T${booking.dropoff_time});
     
const pickupFormatted = pickupTime.toLocaleTimeString([], {
  hour: "numeric",
  minute: "2-digit",
  hour12: true
});

const dropoffFormatted = dropoffTime.toLocaleTimeString([], {
  hour: "numeric",
  minute: "2-digit",
  hour12: true
});
    const card = document.createElement("div");

    card.innerHTML = `
  <hr>
  <p>🏍️ Bike ID: ${booking.bike_id}</p>
  <p>📅 Pickup: ${booking.start_date} at ${booking.pickup_time}</p>
  <p>📅 Drop-off: ${booking.end_date} at ${booking.dropoff_time}</p>
  <p>💰 ₹${booking.amount}</p>
  <p>🟡 Status: ${booking.status}</p>
  <button onclick="cancelBooking('${booking.id}')">
    Cancel Booking
  </button>
`;
    bookingList.appendChild(card);

  });
}

message.innerText = "Login successful!";

loadMyBookings();
    async function cancelBooking(bookingId) {
  const { error } = await supabaseClient
    .from("bookings")
    .update({ status: "cancelled" })
    .eq("id", bookingId);

  if (error) {
    message.innerText = error.message;
    return;
  }

  message.innerText = "Booking cancelled successfully!";

  await loadMyBookings();
}
loadBikes();
  </script>

</body>
</html>
