<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentoRide</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>🏍️ RentoRide</h1>

  <h2>Login / Sign Up</h2>

  <input type="email" id="email" placeholder="Email">
  <br><br>

  <input type="password" id="password" placeholder="Password">
  <br><br>

  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>

  <p id="message"></p>


  <!-- =========================
       PROFILE
  ========================== -->

  <div id="profile" style="display:none;">

    <h2>My Profile</h2>

    <p>
      Name:
      <span id="profileName"></span>
    </p>

    <p>
      Email:
      <span id="profileEmail"></span>
    </p>

    <p>
      Phone:
      <span id="profilePhone"></span>
    </p>

  </div>


  <!-- =========================
       AVAILABLE BIKES
  ========================== -->

  <h2>Available Bikes</h2>

  <div id="bikeList">
    Loading bikes...
  </div>


  <!-- =========================
       BOOKING FORM
  ========================== -->

  <div id="bookingForm" style="display:none;">

    <hr>

    <h2>Book Bike</h2>

    <p>
      Bike:
      <span id="bookingBikeName"></span>
    </p>

    <label>Start Date</label>
    <br>
    <input type="date" id="startDate">

    <br><br>

    <label>End Date</label>
    <br>
    <input type="date" id="endDate">

    <br><br>

    <p>
      Total Amount:
      ₹<span id="bookingAmount">0</span>
    </p>

    <button id="confirmBookingBtn">
      Confirm Booking
    </button>

    <button id="cancelBookingFormBtn">
      Cancel
    </button>

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script>

    const SUPABASE_URL =
      "https://axvttcxrhsblvkmcnqgb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Nn7T1_HByXSy9Vrxy4XgoA_KlsJAafa";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const message =
      document.getElementById("message");


    const profile =
      document.getElementById("profile");

    const profileName =
      document.getElementById("profileName");

    const profileEmail =
      document.getElementById("profileEmail");

    const profilePhone =
      document.getElementById("profilePhone");


    const bookingForm =
      document.getElementById("bookingForm");

    const bookingBikeName =
      document.getElementById("bookingBikeName");

    const startDate =
      document.getElementById("startDate");

    const endDate =
      document.getElementById("endDate");

    const bookingAmount =
      document.getElementById("bookingAmount");

    const confirmBookingBtn =
      document.getElementById("confirmBookingBtn");

    const cancelBookingFormBtn =
      document.getElementById("cancelBookingFormBtn");


    let selectedBikeId = null;
    let selectedPricePerDay = 0;


    // =========================
    // SIGN UP
    // =========================

    document
      .getElementById("signupBtn")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        if (!email || !password) {

          message.innerText =
            "Please enter email and password.";

          return;
        }


        message.innerText =
          "Creating account...";


        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });


        console.log(
          "Signup response:",
          data,
          error
        );


        if (error) {

          message.innerText =
            error.message;

        } else {

          message.innerText =
            "Signup successful! Check your email.";

        }

      });


    // =========================
    // LOGIN
    // =========================

    document
      .getElementById("loginBtn")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        if (!email || !password) {

          message.innerText =
            "Please enter email and password.";

          return;
        }


        message.innerText =
          "Logging in...";


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

          });


        console.log(
          "Login response:",
          data,
          error
        );


        if (error) {

          message.innerText =
            error.message;

          return;
        }


        message.innerText =
          "Login successful!";


        const user =
          data.user;


        if (!user) {

          message.innerText =
            "User not found.";

          return;
        }


        // =========================
        // LOAD PROFILE
        // =========================

        const {
          data: profileData,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("id, name, email, phone")
            .eq("id", user.id)
            .single();


        console.log(
          "Profile response:",
          profileData,
          profileError
        );


        if (profileError) {

          message.innerText =
            "Login successful, but profile could not be loaded: " +
            profileError.message;

          return;
        }


        profile.style.display =
          "block";


        profileName.innerText =
          profileData.name || "Not added";


        profileEmail.innerText =
          profileData.email ||
          user.email ||
          "Not added";


        profilePhone.innerText =
          profileData.phone ||
          "Not added";

      });


    // =========================
    // OPEN BIKE FORM
    // =========================

    const addBikeBtn =
      document.getElementById("addBikeBtn");

    if (addBikeBtn) {

      addBikeBtn.addEventListener(
        "click",
        () => {

          document.getElementById(
            "bikeForm"
          ).style.display = "block";

        }
      );

    }


    // =========================
    // SAVE BIKE
    // =========================

    const saveBikeBtn =
      document.getElementById("saveBikeBtn");

    if (saveBikeBtn) {

      saveBikeBtn.addEventListener(
        "click",
        async () => {

          const bikeName =
            document
              .getElementById("bikeName")
              .value
              .trim();


          const bikeBrand =
            document
              .getElementById("bikeBrand")
              .value
              .trim();


          const bikePrice =
            document
              .getElementById("bikePrice")
              .value;


          const bikeLocation =
            document
              .getElementById("bikeLocation")
              .value
              .trim();


          const bikeImage =
            document
              .getElementById("bikeImage")
              .value
              .trim();


          if (
            !bikeName ||
            !bikeBrand ||
            !bikePrice ||
            !bikeLocation
          ) {

            message.innerText =
              "Please fill all required fields.";

            return;
          }


          const {
            data: userData
          } =
            await supabaseClient.auth.getUser();


          if (!userData.user) {

            message.innerText =
              "Please login first.";

            return;
          }


          message.innerText =
            "Adding bike...";


          const { error } =
            await supabaseClient
              .from("bikes")
              .insert({

                owner_id:
                  userData.user.id,

                bike_name:
                  bikeName,

                brand:
                  bikeBrand,

                price_per_day:
                  Number(bikePrice),

                location:
                  bikeLocation,

                image_url:
                  bikeImage

              });


          if (error) {

            message.innerText =
              error.message;

            return;
          }


          message.innerText =
            "Bike added successfully!";


          document.getElementById(
            "bikeForm"
          ).style.display = "none";


          document.getElementById(
            "bikeName"
          ).value = "";


          document.getElementById(
            "bikeBrand"
          ).value = "";


          document.getElementById(
            "bikePrice"
          ).value = "";


          document.getElementById(
            "bikeLocation"
          ).value = "";


          document.getElementById(
            "bikeImage"
          ).value = "";


          loadBikes();

        }
      );

    }


    // =========================
    // LOAD BIKES
    // =========================

    async function loadBikes() {

      const bikeList =
        document.getElementById(
          "bikeList"
        );


      bikeList.innerHTML =
        "Loading bikes...";


      const {
        data: bikes,
        error
      } =
        await supabaseClient
          .from("bikes")
          .select(
            "id, bike_name, brand, price_per_day, location, image_url"
          );


      if (error) {

        bikeList.innerText =
          error.message;

        return;
      }


      if (!bikes || bikes.length === 0) {

        bikeList.innerText =
          "No bikes available.";

        return;
      }


      bikeList.innerHTML =
        "";


      bikes.forEach((bike) => {

        const card =
          document.createElement("div");


        card.innerHTML = `

          <hr>

          <h3>
            ${bike.bike_name}
          </h3>

          <p>
            Brand: ${bike.brand}
          </p>

          <p>
            ₹${bike.price_per_day} / day
          </p>

          <p>
            📍 ${bike.location}
          </p>

          ${
            bike.image_url
              ? `<img
                   src="${bike.image_url}"
                   alt="${bike.bike_name}"
                   width="250"
                 >`
              : ""
          }

          <br><br>

          <button class="bookBikeBtn">
            Book Now
          </button>

        `;


        bikeList.appendChild(card);


        // =========================
        // BOOK NOW
        // =========================

        const bookButton =
          card.querySelector(
            ".bookBikeBtn"
          );


        bookButton.addEventListener(
          "click",
          async () => {

            const {
              data: userData
            } =
              await supabaseClient.auth.getUser();


            if (!userData.user) {

              message.innerText =
                "Please login first to book a bike.";

              return;
            }


            selectedBikeId =
              bike.id;


            selectedPricePerDay =
              Number(
                bike.price_per_day
              );


            bookingBikeName.innerText =
              ${bike.bike_name} - ${bike.brand};


            bookingAmount.innerText =
              "0";


            startDate.value =
              "";

            endDate.value =
              "";


            bookingForm.style.display =
              "block";


            bookingForm.scrollIntoView({
              behavior: "smooth"
            });

          }
        );

      });

    }


    // =========================
    // CALCULATE BOOKING AMOUNT
    // =========================

    function calculateBookingAmount() {

      if (
        !startDate.value ||
        !endDate.value
      ) {

        bookingAmount.innerText =
          "0";

        return 0;
      }


      const start =
        new Date(
          startDate.value
        );


      const end =
        new Date(
          endDate.value
        );


      const difference =
        end - start;


      const days =
        Math.ceil(
          difference /
          (1000 * 60 * 60 * 24)
        ) + 1;


      if (days <= 0) {

        bookingAmount.innerText =
          "0";

        return 0;
      }


      const total =
        days *
        selectedPricePerDay;


      bookingAmount.innerText =
        total;


      return total;

    }


    startDate.addEventListener(
      "change",
      calculateBookingAmount
    );


    endDate.addEventListener(
      "change",
      calculateBookingAmount
    );


    // =========================
    // CONFIRM BOOKING
    // =========================

    confirmBookingBtn.addEventListener(
      "click",
      async () => {

        if (!selectedBikeId) {

          message.innerText =
            "Please select a bike.";

          return;
        }


        if (
          !startDate.value ||
          !endDate.value
        ) {

          message.innerText =
            "Please select start and end date.";

          return;
        }


        const start =
          new Date(
            startDate.value
          );


        const end =
          new Date(
            endDate.value
          );


        if (end < start) {

          message.innerText =
            "End date cannot be before start date.";

          return;
        }


        const total =
          calculateBookingAmount();


        if (!total) {

          message.innerText =
            "Invalid booking amount.";

          return;
        }


        const {
          data: userData
        } =
          await supabaseClient.auth.getUser();


        if (!userData.user) {

          message.innerText =
            "Please login first.";

          return;
        }


        message.innerText =
          "Creating booking...";


        const {
          data: bookingData,
          error
        } =
          await supabaseClient
            .from("bookings")
            .insert({

              user_id:
                userData.user.id,

              bike_id:
                selectedBikeId,

              start_date:
                startDate.value,

              end_date:
                endDate.value,

              amount:
                total,

              status:
                "pending"

            })
            .select()
            .single();


        if (error) {

          console.error(
            "Booking error:",
            error
          );


          message.innerText =
            "Booking failed: " +
            error.message;

          return;
        }


        console.log(
          "Booking created:",
          bookingData
        );


        message.innerText =
          "🎉 Booking created successfully!";


        bookingForm.style.display =
          "none";


        selectedBikeId =
          null;

        selectedPricePerDay =
          0;

      }
    );


    // =========================
    // CANCEL BOOKING FORM
    // =========================

    cancelBookingFormBtn.addEventListener(
      "click",
      () => {

        bookingForm.style.display =
          "none";


        selectedBikeId =
          null;

        selectedPricePerDay =
          0;


        startDate.value =
          "";

        endDate.value =
          "";

        bookingAmount.innerText =
          "0";

      }
    );


    // =========================
    // START
    // =========================

    loadBikes();

  </script>

</body>
</html>
