<!DOCTYPE html>
<html>
<head>
  <title>RentoRide - Add Bike</title>
</head>
<body>

  <h1>RentoRide</h1>
  <h2>Add Your Bike</h2>

  <form id="bikeForm">

    <input type="text" id="bikeName" placeholder="Bike Name">
    <br><br>

    <input type="text" id="bikeBrand" placeholder="Brand">
    <br><br>

    <input type="number" id="bikePrice" placeholder="Price per day">
    <br><br>

    <input type="number" id="price3h" placeholder="Price for 3 hours">
    <br><br>

    <input type="number" id="price6h" placeholder="Price for 6 hours">
    <br><br>

    <input type="number" id="price12h" placeholder="Price for 12 hours">
    <br><br>

    <input type="text" id="bikeLocation" placeholder="Location">
    <br><br>

    <input type="file" id="bikeImage" accept="image/*">
    <br><br>

    <button type="submit">Add Bike</button>

  </form>

</body>
</html>
